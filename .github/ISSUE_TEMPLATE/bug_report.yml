name: Bug report
description: Something in Cairn behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security** issue — anything that
        causes a network request, or exposes recordings to another app — please
        do not file it here. See [SECURITY.md](https://github.com/uveshm003/cairn/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a video entry
        2. Flip to the front camera mid-take
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Capture (recording, camera, markers)
        - Compression / saving
        - Playback (waveform, speed, A-B loop)
        - Library (search, filter, grouping)
        - Backup / export / import
        - Quick capture (widget or tile)
        - Settings / onboarding
        - Something else
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      description: Exact model and OS version — encoder behaviour varies a lot across OEMs.
      placeholder: "Pixel 7 Pro, Android 17"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cairn version or commit
      placeholder: "1.0.0+1, or commit 3735161"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build type
      options:
        - Release
        - Debug
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant output from `flutter run` or `adb logcat`. Paste as text, not a screenshot.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this.
          required: true
        - label: I checked the README's *What is unverified* section, in case this is a known gap.
          required: true
