name: Feature request
description: Suggest something Cairn should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Cairn makes **no network requests, ever** — no account, sync, analytics,
        or remote anything. Requests that need the network will be closed, however
        good the idea. See [CONTRIBUTING.md](https://github.com/uveshm003/cairn/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Cairn makes hard today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true

  - type: checkboxes
    id: offline
    attributes:
      label: Offline check
      options:
        - label: This works entirely on-device and needs no network access.
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including working around it with what already exists.

  - type: checkboxes
    id: scope
    attributes:
      label: Already on the list
      description: These are known and deliberately deferred (README, *Not built*). Tick if yours is one of them.
      options:
        - label: Custom entry types
        - label: Collections / folders
        - label: In-app trim
        - label: On-device transcription
